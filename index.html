<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحليلات المتعلمين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 25px; color: #2c3e50; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .kpi-card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border-top: 4px solid #3498db; }
        .kpi-card h3 { font-size: 14px; color: #7f8c8d; margin-bottom: 10px; }
        .kpi-card .value { font-size: 24px; font-weight: 700; color: #2c3e50; }
        .table-container { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #2c3e50; font-weight: 600; }
        .badge-pass { background-color: #e8f8f5; color: #27ae60; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge-fail { background-color: #fdebd0; color: #e67e22; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .loading { text-align: center; padding: 20px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة تحكم أداء المتدربين (البيانات الحية الفورية)</h1>

    <div class="kpi-grid">
        <div class="kpi-card"><h3>إجمالي المتعلمين</h3><div class="value" id="totalStudents">0</div></div>
        <div class="kpi-card" style="border-color: #2ecc71;"><h3>متوسط الدرجات</h3><div class="value" id="avgScore">0%</div></div>
        <div class="kpi-card" style="border-color: #e74c3c;"><h3>نسبة الاجتياز</h3><div class="value" id="passRate">0%</div></div>
        <div class="kpi-card" style="border-color: #f1c40f;"><h3>متوسط التقييم</h3><div class="value" id="avgRating">0 / 0.0</div></div>
    </div>

    <div class="container" style="text-align: center; margin-bottom: 20px;">
        <button onclick="fetchData()" style="padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-family: 'Cairo'; font-weight: bold;">تحديث البيانات الآن</button>
    </div>

    <div class="table-container">
        <h2>سجل أداء المتدربين الحي</h2>
        <table>
            <thead>
                <tr>
                    <th>اسم المتعلم</th>
                    <th>البريد الإلكتروني</th>
                    <th>الدرجة</th>
                    <th>الحالة</th>
                    <th>التقييم</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody">
                <tr><td colspan="5" class="loading">اضغط على زر التحديث لجلب البيانات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ضع هنا رابط الـ Production Webhook الخاص بـ n8n
    const n8nUrl = "https://n8n-course.saytech-egy.com/webhook-test/0bc91fe3-f463-40c5-81dc-78b723249d1b";

    async function fetchData() {
        const tbody = document.getElementById('resultsTableBody');
        tbody.innerHTML = '<tr><td colspan="5" class="loading">جاري جلب البيانات...</td></tr>';

        try {
            const response = await fetch(n8nUrl);
            const data = await response.json();
            
            let records = Array.isArray(data) ? data : [data];
            // تنقية البيانات لتناسب الهيكل الناتج من n8n
            records = records.map(item => item.json || item);

            updateDashboard(records);
        } catch (error) {
            console.error('خطأ في الاتصال:', error);
            tbody.innerHTML = '<tr><td colspan="5" class="loading" style="color: red;">تعذر الاتصال بسيرفر n8n</td></tr>';
        }
    }

    function updateDashboard(dataArray) {
        const totalStudents = dataArray.length;
        const totalScore = dataArray.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
        const avgScore = totalStudents > 0 ? Math.round(totalScore / totalStudents) : 0;

        const passedCount = dataArray.filter(curr => {
            const status = (curr.status || '').toLowerCase();
            return status === "pass" || status === "اجتاز" || status === "passed";
        }).length;
        const passRate = totalStudents > 0 ? Math.round((passedCount / totalStudents) * 100) : 0;

        const totalRating = dataArray.reduce((acc, curr) => acc + (parseFloat(curr.rating) || 0), 0);
        const avgRating = totalStudents > 0 ? (totalRating / totalStudents).toFixed(1) : 0;

        document.getElementById('totalStudents').innerText = totalStudents;
        document.getElementById('avgScore').innerText = avgScore + '%';
        document.getElementById('passRate').innerText = passRate + '%';
        document.getElementById('avgRating').innerText = avgRating + ' / 5';

        const tbody = document.getElementById('resultsTableBody');
        tbody.innerHTML = '';

        if (totalStudents === 0 || !dataArray[0].name) {
            tbody.innerHTML = '<tr><td colspan="5" class="loading">لا توجد بيانات مسجلة حتى الآن</td></tr>';
            return;
        }

        dataArray.slice().reverse().forEach(row => {
            const status = (row.status || '').toLowerCase();
            const isPassed = status === 'pass' || status === 'اجتاز' || status === 'passed';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.name || ''}</td>
                <td>${row.email || ''}</td>
                <td>${row.score || 0}%</td>
                <td><span class="${isPassed ? 'badge-pass' : 'badge-fail'}">${isPassed ? 'اجتاز' : 'راسب'}</span></td>
                <td>⭐ ${row.rating || 0}</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
