<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحليلات المتعلمين - Live Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid #3498db;
        }
        .kpi-card h3 {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        .kpi-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #2c3e50;
        }
        .table-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .table-container h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: 600;
        }
        .badge-pass {
            background-color: #e8f8f5;
            color: #27ae60;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-fail {
            background-color: #fdebd0;
            color: #e67e22;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة تحكم أداء المتدربين (البيانات الحية)</h1>

    <div class="kpi-grid">
        <div class="kpi-card" style="border-color: #3498db;">
            <h3>إجمالي المتعلمين</h3>
            <div class="value" id="totalStudents">0</div>
        </div>
        <div class="kpi-card" style="border-color: #2ecc71;">
            <h3>متوسط الدرجات</h3>
            <div class="value" id="avgScore">0%</div>
        </div>
        <div class="kpi-card" style="border-color: #e74c3c;">
            <h3>نسبة الاجتياز</h3>
            <div class="value" id="passRate">0%</div>
        </div>
        <div class="kpi-card" style="border-color: #f1c40f;">
            <h3>متوسط التقييم</h3>
            <div class="value" id="avgRating">0 / 5</div>
        </div>
    </div>

    <div class="table-container">
        <h2>سجل أداء المتدربين الحي</h2>
        <table>
            <thead>
                <tr>
                    <th>اسم المتعلم</th>
                    <th>البريد الإلكتروني</th>
                    <th>الدرجة</th>
                    <th>الحالة</th>
                    <th>التقييم</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody">
                <tr><td colspan="5" class="loading">جاري جلب البيانات من جوجل شيت...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function fetchSheetData() {
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9L8OkTZwAD40FJUf7x_b--YWWdQd-QJRuqY6wMfnpnS_2Tc3zBzU8bZl9g2ipjWN_ZtejBGsH-DMP/pub?output=csv";

        try {
            const response = await fetch(csvUrl);
            const textData = await response.text();
            
            const rows = textData.split('\n');
            const formattedData = [];

            for (let i = 1; i < rows.length; i++) {
                const rowText = rows[i].trim();
                if (!rowText) continue; // تخطي أي سطر فارغ تماماً
                
                const cols = rowText.split(',');
                // التحقق من وجود بيانات حقيقية في السطر
                if (cols.length >= 5 && cols[0].replace(/"/g, '').trim() !== "") {
                    formattedData.push({
                        name: cols[0].replace(/"/g, '').trim(),
                        email: cols[1].replace(/"/g, '').trim(),
                        score: parseFloat(cols[2]) || 0,
                        status: cols[3].replace(/"/g, '').trim().toLowerCase() || 'fail',
                        rating: parseInt(cols[4]) || 0
                    });
                }
            }

            // تحديث الداشبورد فقط إذا تم العثور على بيانات صالحة، لمنع مسح الجدول عند تأخر الاستجابة
            if (formattedData.length > 0) {
                updateDashboard(formattedData);
            }
        } catch (error) {
            console.error('خطأ في جلب بيانات الشيت:', error);
        }
    }

    function updateDashboard(data) {
        const totalStudents = data.length;
        
        const totalScore = data.reduce((acc, curr) => acc + curr.score, 0);
        const avgScore = totalStudents > 0 ? Math.round(totalScore / totalStudents) : 0;

        const passedCount = data.filter(curr => curr.status === "pass" || curr.status === "اجتاز").length;
        const passRate = totalStudents > 0 ? Math.round((passedCount / totalStudents) * 100) : 0;

        const totalRating = data.reduce((acc, curr) => acc + curr.rating, 0);
        const avgRating = totalStudents > 0 ? (totalRating / totalStudents).toFixed(1) : 0;

        document.getElementById('totalStudents').innerText = totalStudents;
        document.getElementById('avgScore').innerText = avgScore + '%';
        document.getElementById('passRate').innerText = passRate + '%';
        document.getElementById('avgRating').innerText = avgRating + ' / 5';

        const tbody = document.getElementById('resultsTableBody');
        tbody.innerHTML = '';

        // عرض النتائج من الأحدث للأقدم
        data.slice().reverse().forEach(row => {
            const isPassed = row.status === 'pass' || row.status === 'اجتاز';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.name}</td>
                <td>${row.email}</td>
                <td>${row.score}%</td>
                <td><span class="${isPassed ? 'badge-pass' : 'badge-fail'}">${isPassed ? 'اجتاز' : 'راسب'}</span></td>
                <td>⭐ ${row.rating}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // جلب البيانات فور تحميل الصفحة وتحديثها تلقائياً كل 10 ثوانٍ
    fetchSheetData();
    setInterval(fetchSheetData, 10000);
</script>

</body>
</html>
